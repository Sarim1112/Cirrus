[project]
name = "cirrus-api"
version = "0.1.0"
description = "Cirrus API: statement import, analytics engine and grounded budget advisor"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pydantic[email]>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "pdfplumber>=0.11,<1",
  "httpx>=0.27,<1",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "fpdf2>=2.7"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["B008", "S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"evals/*" = ["S311"]
"app/demo_data.py" = ["S311"]
