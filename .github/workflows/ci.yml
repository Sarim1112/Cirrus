name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cirrus
          POSTGRES_PASSWORD: cirrus
          POSTGRES_DB: cirrus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cirrus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CIRRUS_DATABASE_URL: postgresql+psycopg://cirrus:cirrus@localhost:5432/cirrus
      CIRRUS_TEST_DATABASE_URL: postgresql+psycopg://cirrus:cirrus@localhost:5432/cirrus
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Check migrations match the models
        run: |
          alembic upgrade head
          alembic check
      - name: Advisor accuracy
        run: python -m evals.run
      - name: Tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build api web
